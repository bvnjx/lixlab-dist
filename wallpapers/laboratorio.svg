<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1626"/>
      <stop offset="55%" stop-color="#16233c"/>
      <stop offset="100%" stop-color="#1d2f4d"/>
    </linearGradient>
    <radialGradient id="brillo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5ad2f0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5ad2f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fondo)"/>

  <!-- rejilla técnica -->
  <g stroke="#4a7fa8" stroke-width="1" opacity=".16">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>

  <!-- halos -->
  <circle cx="450" cy="380" r="280" fill="url(#brillo)"/>
  <circle cx="1150" cy="480" r="230" fill="url(#brillo)" opacity=".7"/>

  <!-- matraces -->
  <g transform="translate(430,470)">
    <path d="M-26 -110 L-26 -46 L-62 30 A10 10 0 0 0 -52 46 L52 46 A10 10 0 0 0 62 30 L26 -46 L26 -110 Z"
          fill="#0d1b2c" stroke="#7fd6f0" stroke-width="4" opacity=".95"/>
    <path d="M-52 10 L52 10 L52 30 A10 10 0 0 1 42 46 L-42 46 A10 10 0 0 1 -52 30 Z" fill="#3fd67f" opacity=".8"/>
    <circle cx="-16" cy="22" r="6" fill="#8ff0b4" opacity=".8"/>
    <circle cx="12" cy="30" r="4" fill="#8ff0b4" opacity=".7"/>
    <rect x="-32" y="-118" width="64" height="10" fill="#7fd6f0" opacity=".9"/>
  </g>

  <g transform="translate(1150,540) scale(.8)">
    <path d="M-26 -110 L-26 -46 L-62 30 A10 10 0 0 0 -52 46 L52 46 A10 10 0 0 0 62 30 L26 -46 L26 -110 Z"
          fill="#0d1b2c" stroke="#7fd6f0" stroke-width="4" opacity=".95"/>
    <path d="M-46 18 L46 18 L52 30 A10 10 0 0 1 42 46 L-42 46 A10 10 0 0 1 -52 30 Z" fill="#c86bf0" opacity=".75"/>
    <circle cx="8" cy="30" r="5" fill="#e2a9ff" opacity=".8"/>
    <rect x="-32" y="-118" width="64" height="10" fill="#7fd6f0" opacity=".9"/>
  </g>

  <!-- burbujas subiendo -->
  <g fill="#8ff0b4" opacity=".5">
    <circle cx="418" cy="330" r="7"/><circle cx="440" cy="280" r="5"/><circle cx="424" cy="232" r="4"/>
  </g>
  <g fill="#e2a9ff" opacity=".45">
    <circle cx="1145" cy="420" r="6"/><circle cx="1162" cy="376" r="4"/>
  </g>

  <!-- bloques flotando (mod-a-day) -->
  <g opacity=".55">
    <g transform="translate(760,300) rotate(12)"><rect x="-30" y="-30" width="60" height="60" fill="#2c4460" stroke="#7fd6f0" stroke-width="3"/></g>
    <g transform="translate(880,420) rotate(-8)"><rect x="-22" y="-22" width="44" height="44" fill="#2c4460" stroke="#8ff0b4" stroke-width="3"/></g>
    <g transform="translate(660,470) rotate(20)"><rect x="-18" y="-18" width="36" height="36" fill="#2c4460" stroke="#e2a9ff" stroke-width="3"/></g>
  </g>

  <!-- mesa -->
  <rect x="0" y="640" width="1600" height="18" fill="#24384f"/>
  <rect x="0" y="658" width="1600" height="242" fill="#131f31"/>

  <!-- sello PROXIMAMENTE -->
  <g transform="translate(800,760)" opacity=".9">
    <rect x="-215" y="-34" width="430" height="68" rx="8" fill="none" stroke="#7fd6f0" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="0" y="12" font-family="monospace" font-size="34" letter-spacing="9"
          text-anchor="middle" fill="#7fd6f0">PRÓXIMAMENTE</text>
  </g>

  <radialGradient id="vin" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".6"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vin)"/>
</svg>

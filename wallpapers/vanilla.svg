<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3350"/>
      <stop offset="42%" stop-color="#3d6b8f"/>
      <stop offset="72%" stop-color="#e9a765"/>
      <stop offset="100%" stop-color="#f2c48a"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e86a6"/>
      <stop offset="100%" stop-color="#2f5a75"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#ffbe6a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffbe6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#cielo)"/>

  <!-- sol poniente -->
  <circle cx="1180" cy="560" r="190" fill="url(#sol)"/>
  <rect x="1140" y="520" width="80" height="80" fill="#ffd98e" opacity=".95"/>

  <!-- nubes cuadradas -->
  <g fill="#ffffff" opacity=".55">
    <rect x="180" y="170" width="150" height="34"/><rect x="215" y="140" width="90" height="32"/>
    <rect x="620" y="230" width="190" height="32"/><rect x="665" y="200" width="105" height="30"/>
    <rect x="1230" y="140" width="160" height="30"/><rect x="1270" y="112" width="85" height="28"/>
  </g>

  <!-- montañas lejanas -->
  <g opacity=".45" fill="#2b4a63">
    <polygon points="0,520 180,400 320,470 470,380 620,500 620,620 0,620"/>
    <polygon points="900,510 1060,410 1200,480 1380,390 1600,500 1600,620 900,620"/>
  </g>

  <!-- agua -->
  <rect x="0" y="600" width="1600" height="120" fill="url(#agua)"/>
  <g opacity=".35" fill="#cfe9f5">
    <rect x="120" y="630" width="90" height="6"/><rect x="380" y="660" width="120" height="6"/>
    <rect x="820" y="640" width="100" height="6"/><rect x="1240" y="672" width="140" height="6"/>
  </g>

  <!-- terreno en bloques -->
  <g>
    <rect x="0" y="560" width="360" height="60" fill="#6aa84f"/>
    <rect x="0" y="620" width="360" height="120" fill="#7a5a3c"/>
    <rect x="360" y="596" width="180" height="42" fill="#6aa84f"/>
    <rect x="360" y="638" width="180" height="102" fill="#7a5a3c"/>
    <rect x="1020" y="580" width="290" height="46" fill="#6aa84f"/>
    <rect x="1020" y="626" width="290" height="114" fill="#7a5a3c"/>
    <rect x="1310" y="606" width="290" height="40" fill="#6aa84f"/>
    <rect x="1310" y="646" width="290" height="94" fill="#7a5a3c"/>
  </g>

  <!-- árboles -->
  <g>
    <g transform="translate(90,560)"><rect x="-6" y="-40" width="13" height="42" fill="#4a3524"/><rect x="-34" y="-86" width="70" height="48" fill="#4e8a3c"/><rect x="-22" y="-108" width="46" height="26" fill="#5c9c46"/></g>
    <g transform="translate(250,560)"><rect x="-5" y="-34" width="11" height="36" fill="#4a3524"/><rect x="-28" y="-74" width="58" height="42" fill="#4e8a3c"/><rect x="-18" y="-92" width="38" height="22" fill="#5c9c46"/></g>
    <g transform="translate(1120,580)"><rect x="-6" y="-42" width="13" height="44" fill="#4a3524"/><rect x="-34" y="-90" width="70" height="50" fill="#4e8a3c"/><rect x="-22" y="-112" width="46" height="26" fill="#5c9c46"/></g>
    <g transform="translate(1440,606)"><rect x="-5" y="-32" width="11" height="34" fill="#4a3524"/><rect x="-26" y="-70" width="54" height="40" fill="#4e8a3c"/></g>
  </g>

  <!-- casita del spawn -->
  <g transform="translate(430,596)">
    <rect x="-46" y="-72" width="92" height="72" fill="#c9a978"/>
    <polygon points="-56,-72 0,-112 56,-72" fill="#8e4a3a"/>
    <rect x="-14" y="-40" width="28" height="40" fill="#6b4a2e"/>
    <rect x="-36" y="-60" width="20" height="20" fill="#ffd98e" opacity=".9"/>
    <rect x="18" y="-60" width="20" height="20" fill="#ffd98e" opacity=".9"/>
  </g>

  <!-- antorchas -->
  <g>
    <g transform="translate(700,596)"><rect x="-3" y="-30" width="6" height="30" fill="#4a3524"/><rect x="-5" y="-38" width="10" height="10" fill="#ffb648"/></g>
    <g transform="translate(960,580)"><rect x="-3" y="-30" width="6" height="30" fill="#4a3524"/><rect x="-5" y="-38" width="10" height="10" fill="#ffb648"/></g>
  </g>

  <!-- primer plano -->
  <rect x="0" y="740" width="1600" height="160" fill="#3e2c1c"/>
  <rect x="0" y="740" width="1600" height="14" fill="#57803a"/>

  <radialGradient id="vin" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vin)"/>
</svg>
